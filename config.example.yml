bot:
  name: "昔涟"
  # ★ openid 与 appid 绑定：用 ${QQ_OWNER_ID} 由 .env 注入（推荐，部署不漂移），
  #   或直接填值。QQ 官方场景填用户 openid（消息事件 user_openid 字段，非 QQ 号）；
  #   OneBot 场景填 QQ 号。换 bot 后必须更新为对应维度下的 openid。
  ownerId: "${QQ_OWNER_ID}"

llm:
  baseUrl: "https://api.deepseek.com/v1"
  apiKey: "${OPENAI_API_KEY}"
  model: "deepseek-v4-flash"

embed:
  baseUrl: "https://open.bigmodel.cn/api/paas/v4"
  apiKey: "${EMBED_API_KEY}"
  model: "${EMBED_MODEL}"

platforms:
  # telegram:
  #   token: "${TELEGRAM_BOT_TOKEN}"
  qq:
    protocol: "onebot_v11"
    ws_port: 6199
    http_port: 3000
  qq_official:
    app_id: "${QQ_APP_ID}"
    app_secret: "${QQ_APP_SECRET}"

server:
  port: 6185
  dataDir: "./data"
  workspaceDir: "./data/workspace"

# 能力开关（服务端默认聊天模式；桌面端改为 codeMode: true 即可）
features:
  codeMode: false
  # shell: true       # 桌面端：开启 shell 执行
  # filesystem: true  # 桌面端：开启文件读写
  # streaming: true   # 桌面端：开启流式输出
