bot:
  name: "昔涟"
  # ★ openid 与 appid 绑定：用 ${QQ_OWNER_ID} 由 .env 注入（推荐，部署不漂移），
  #   或直接填值。QQ 官方场景填用户 openid（消息事件 user_openid 字段，非 QQ 号）；
  #   OneBot 场景填 QQ 号。换 bot 后必须更新为对应维度下的 openid。
  ownerId: "${QQ_OWNER_ID}"

llm:
  baseUrl: "https://api.deepseek.com/v1"
  apiKey: "${OPENAI_API_KEY}"
  model: "deepseek-v4-flash"

embed:
  baseUrl: "https://open.bigmodel.cn/api/paas/v4"
  apiKey: "${EMBED_API_KEY}"
  model: "${EMBED_MODEL}"

platforms:
  # telegram:
  #   token: "${TELEGRAM_BOT_TOKEN}"
  qq:
    protocol: "onebot_v11"
    ws_port: 6199
    http_port: 3000
  qq_official:
    app_id: "${QQ_APP_ID}"
    app_secret: "${QQ_APP_SECRET}"

server:
  port: 6185
  # 监听地址（★ 9-25 server-bind-host）。缺省 0.0.0.0（对外，线上容器需要）。
  # 绑定回环（127.0.0.1 / localhost / ::1）→ 只有本机可达 → /api/* 自动免鉴权。
  # 改回对外地址会自动恢复鉴权——鉴权跟随绑定地址，没有独立开关。
  #
  # ⚠️ 本机使用**不要**在这里写 host —— 本文件会被部署 SOP 打包传到服务器
  #   （tar czf alysia-deploy.tar.gz compose.yml config.yml），
  #   写 "127.0.0.1" 会让容器绑回环、6186:6185 端口映射失效、服务器失联。
  #   请在 .env 里写 ALYSIA_HOST=127.0.0.1（.env 不进部署包）。
  dataDir: "./data"
  workspaceDir: "./data/workspace"

# 能力开关（服务端默认聊天模式；桌面端改为 codeMode: true 即可）
features:
  codeMode: false
  # shell: true       # 桌面端：开启 shell 执行
  # filesystem: true  # 桌面端：开启文件读写
  # streaming: true   # 桌面端：开启流式输出

# ★ 采样参数统一配置（8-10 新增）：按场景分槽，不配则走 core 默认 floor。
#   只改需要的槽/字段即可，全部可省略。
sampling:
  # 主对话 ReAct（她的"嗓子"）：默认不传参数（走服务端默认），想调在此配置
  # chat:
  #   temperature: 0.7
  #   top_p: 1
  #   presence_penalty: 0
  #   frequency_penalty: 0
  #   max_tokens: 1024
  # vision:
  #   describe:          # 图→描述，默认 temperature 0.1 / max_tokens 200
  #     temperature: 0.1
  #     max_tokens: 200
  # life:
  #   generateEvent:     # 事件生成，默认 temperature 0.9（偏高/活）
  #     temperature: 0.9
  #   generateSummary:   # 每日摘要，默认 temperature 0.3 / max_tokens 512（低温/忠）
  #     temperature: 0.3
  #     max_tokens: 512
  # proactive:
  #   personalize:       # 问候/关怀文案，默认 temperature 0.7 / max_tokens 256
  #     temperature: 0.7
  #     max_tokens: 256
  # profile:
  #   extract:           # 事实提取，默认 temperature 0.1 / max_tokens 1024（低温）
  #     temperature: 0.1
  #     max_tokens: 1024
  # session:
  #   summary:           # 会话摘要，默认 temperature 0.3 / max_tokens 512（低温）
  #     temperature: 0.3
