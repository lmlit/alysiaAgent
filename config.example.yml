bot:
  name: "昔涟"
  # ★ openid 与 appid 绑定：用 ${QQ_OWNER_ID} 由 .env 注入（推荐，部署不漂移），
  #   或直接填值。QQ 官方场景填用户 openid（消息事件 user_openid 字段，非 QQ 号）；
  #   OneBot 场景填 QQ 号。换 bot 后必须更新为对应维度下的 openid。
  ownerId: "${QQ_OWNER_ID}"

llm:
  baseUrl: "https://api.deepseek.com/v1"
  apiKey: "${OPENAI_API_KEY}"
  model: "deepseek-v4-flash"

embed:
  baseUrl: "https://open.bigmodel.cn/api/paas/v4"
  apiKey: "${EMBED_API_KEY}"
  model: "${EMBED_MODEL}"

platforms:
  # telegram:
  #   token: "${TELEGRAM_BOT_TOKEN}"
  qq:
    protocol: "onebot_v11"
    ws_port: 6199
    http_port: 3000
  qq_official:
    app_id: "${QQ_APP_ID}"
    app_secret: "${QQ_APP_SECRET}"

server:
  port: 6185
  # 监听地址（★ 9-25 server-bind-host）。缺省 0.0.0.0（对外，线上容器需要）。
  # 绑定回环（127.0.0.1 / localhost / ::1）→ 只有本机可达 → /api/* 自动免鉴权。
  # 改回对外地址会自动恢复鉴权——鉴权跟随绑定地址，没有独立开关。
  #
  # ⚠️ 本机使用**不要**在这里写 host —— 本文件会被部署 SOP 打包传到服务器
  #   （tar czf alysia-deploy.tar.gz compose.yml config.yml），
  #   写 "127.0.0.1" 会让容器绑回环、6186:6185 端口映射失效、服务器失联。
  #   请在 .env 里写 ALYSIA_HOST=127.0.0.1（.env 不进部署包）。
  dataDir: "./data"
  workspaceDir: "./data/workspace"

# 能力开关（服务端默认聊天模式；桌面端改为 codeMode: true 即可）
features:
  codeMode: false
  # shell: true       # 桌面端：开启 shell 执行
  # filesystem: true  # 桌面端：开启文件读写
  # streaming: true   # 桌面端：开启流式输出

# ★ 委托项目登记表（2026-10-17，change: add-project-task-delegation）
#   配了它，聊天侧的三个委托工具（start/get/continue_project_task）才会注册；
#   **不配 = 该能力关闭**（配置即开关）。
#
#   ⚠️ `workspace` / `profile` 是**宿主机**上的路径与 dsh profile 名 ——
#      alysia server 在容器里看不到它们，只有**宿主上的 runner** 会用
#      （它从 `GET /api/project-tasks/next` 的响应里拿到，不需要再读一份配置）。
#   ⚠️ 模型**不能**指定项目路径或 profile；它只能用这里的 **id**。
#   ⚠️ 同一项目同时只允许一个在途任务（防止两份改同一份工作区）。
#
# projects:
#   alysia-blog:
#     workspace: /root/alysia-blog
#     profile: alysia
#
# ★ 2026-10-18（change: `gate-project-tasks-to-offpeak`）：委托任务的**执行窗口**。
#   高峰 = 周一至周五（不含法定节假日）9:00-12:00、14:00-18:00（北京时间）
#   空闲 = 其余全部（含周末与法定节假日全天）  —— 高峰时段**只排队、不执行**（省钱）
#
#   ⚠️ holidays 需要**真实数据**，本仓库不内置（每年公布、还涉及调休，猜错比没有更糟）。
#      未列出的日期按工作日处理 ⇒ 窗口照常生效 ⇒ 只会更省，不会多花。
# projectTasks:
#   holidays:
#     - '2026-01-01'
#     - '2026-10-01'
#   # 想改窗口也可以（分钟数，左闭右开）；一般不用动
#   # peakWindows: [[540, 720], [840, 1080]]
#   # ⚠️ nowOverride 是**排障用**：把窗口判定固定到某个时刻（ISO），
#   #    配了会打 WARN，验证完请删掉
#   # nowOverride: '2026-10-19T02:15:00.000Z'

# ★ 采样参数统一配置（8-10 新增）：按场景分槽，不配则走 core 默认 floor。
#   只改需要的槽/字段即可，全部可省略。
sampling:
  # 主对话 ReAct（她的"嗓子"）：默认不传参数（走服务端默认），想调在此配置
  # chat:
  #   temperature: 0.7
  #   top_p: 1
  #   presence_penalty: 0
  #   frequency_penalty: 0
  #   max_tokens: 1024
  # vision:
  #   describe:          # 图→描述，默认 temperature 0.1 / max_tokens 200
  #     temperature: 0.1
  #     max_tokens: 200
  # ⚠️ CHAT_MODEL 是**推理模型**：可见内容与 reasoning **共用同一个 max_tokens 预算**。
  #    预算给小了 → reasoning 吃光 → content 为空、HTTP 200、finish_reason=length。
  #    线上因此出过三次事故：会话摘要 22 天 100% 失败 / 每日反思 11 次空响应 /
  #    画像提取长期静默停摆（2026-10-01 修复）。**调小这些值前先读这条。**
  #    （同步自 core 实测值；此前本文件停留在 512，落后实现两个版本）
  # life:
  #   generateEvent:     # 事件生成，默认 temperature 0.9（偏高/活）
  #     temperature: 0.9
  #   generateSummary:   # 每日反思，默认 temperature 0.3 / max_tokens 2048（低温/忠）
  #     temperature: 0.3
  #     max_tokens: 2048
  # proactive:
  #   personalize:       # 问候/关怀文案，默认 temperature 0.7 / max_tokens 1024
  #     temperature: 0.7
  #     max_tokens: 1024
  # profile:
  #   extract:           # 事实提取（输出 JSON），默认 temperature 0.1 / max_tokens 4096
  #     temperature: 0.1
  #     max_tokens: 4096
  #   deepRewrite:       # Cron 深度画像重写（输出**纯文本**，
  #                      # 故 core 侧不开 response_format——开了 API 会 400），
  #                      # 默认 temperature 0.3 / max_tokens 2048
  #     temperature: 0.3
  #     max_tokens: 2048
  # session:
  #   summary:           # 会话摘要（输出 JSON），默认 temperature 0.3 / max_tokens 4096
  #     temperature: 0.3
  #     max_tokens: 4096
