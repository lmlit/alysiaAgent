<nav class="nav" xmlns:th="https://www.thymeleaf.org" th:fragment="header" th:with="menu = ${menuFinder.getPrimary()}">
  <a class="logo" th:href="@{/}" aria-label="首页">
    <img class="leaf" th:src="@{/assets/svg/leaf.svg}" alt="">
    <span class="brand">
      <span class="name" th:text="${site.title}">站点名称</span>
      <span class="sub" th:if="${theme.config.basic.brand_sub != null and theme.config.basic.brand_sub != ''}"
            th:text="${theme.config.basic.brand_sub}">SOFTWARE · AI</span>
    </span>
  </a>

  <div class="nav-center" id="nav-center">
    <!-- ★ theme-xilian：导航固定为这五项。
         原因：Halo 2.27 的 menus 相关端点（api.halo.run 组 + console 组）都返回 404，
         后台改菜单无法通过 REST 落地；而 setup 时 Halo 会自动建一个
         「首页 / 文章 / 默认分类 / 关于」的菜单，直接用会带着占位项。
         要换成别的项：直接改这里。 -->
    <a th:href="@{/}">首页</a>
    <a th:href="@{/archives}">归档</a>
    <a th:href="@{/categories/daily}">日常</a>
    <a th:href="@{/categories/blank}">留白</a>
    <a th:href="@{/about}">关于</a>
  </div></div>

  <div class="nav-right">
    <div class="weather-switch" role="group" aria-label="背景天气切换" th:if="${theme.config.style.weather == null or theme.config.style.weather}">
      <button type="button" class="weather-btn" data-weather="sun" aria-pressed="false" aria-label="晴天" title="晴天">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button type="button" class="weather-btn" data-weather="rain" aria-pressed="false" aria-label="雨天" title="雨天">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="13" x2="16" y2="21"/><line x1="8" y1="13" x2="8" y2="21"/><line x1="12" y1="15" x2="12" y2="23"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
      </button>
      <button type="button" class="weather-btn" data-weather="snow" aria-pressed="false" aria-label="雪天" title="雪天">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M12 2v20"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>
      </button>
    </div>
    <a class="search-btn"
       th:if="${theme.config.basic?.search_url != null and theme.config.basic?.search_url != ''}"
       th:href="@{${theme.config.basic.search_url}}" aria-label="搜索" title="搜索">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </a>
    <a class="console-btn"
       th:if="${theme.config.basic?.show_console == null or theme.config.basic?.show_console}"
       th:href="@{${theme.config.basic?.console_path != null and theme.config.basic?.console_path != '' ? theme.config.basic.console_path : '/console'}}"
       aria-label="控制台" title="控制台">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><path d="M6 8h4M6 12h6"/></svg>
    </a>
    <a class="nav-cta" th:if="${theme.config.footer.email != null and theme.config.footer.email != ''}"
       th:href="'mailto:' + ${theme.config.footer.email}">联系我</a>
  </div>

  <button type="button" class="nav-toggle" id="nav-toggle" aria-label="打开菜单">
    <span></span><span></span><span></span>
  </button>
</nav>
