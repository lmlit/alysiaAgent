<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head=~{::head}, content=~{::content})}">
<th:block th:fragment="head">
  <th:block th:replace="~{modules/seo :: head(title=${category.spec.displayName + (posts.page > 1 ? ' - 第 ' + posts.page + ' 页' : '') + ' - ' + site.title}, path=${category.status.permalink + (posts.page > 1 ? '/page/' + posts.page : '')}, description=${category.spec.description}, image=${category.spec.cover ?: site.logo}, type='website')}"></th:block>
</th:block>
<th:block th:fragment="content">
  <div class="container">
    <header class="post-hero" style="padding-bottom:10px;">
      <p class="eyebrow">CATEGORY · 分类</p>
      <h1 class="headline" th:text="${category.spec.displayName}">分类名</h1>
      <p class="post-meta-bar" th:if="${category.spec.description != null and category.spec.description != ''}">
        <span th:text="${category.spec.description}">分类描述</span>
      </p>
    </header>

    <div class="section" style="padding-top:20px;">
      <th:block th:if="${#lists.isEmpty(posts.items)}">
        <div class="empty-tip">该分类下暂无文章。</div>
      </th:block>
      
      <div class="empty-note" th:if="${#lists.isEmpty(posts.items)}">
        <p>这里还空着。</p>
        <p class="sub">有些话还没写下来——等写下来，就会出现在这里。</p>
      </div>
<div class="post-list">
        <th:block th:each="post : ${posts.items}">
          <th:block th:replace="~{modules/post-item :: post-item}"></th:block>
        </th:block>
      </div>
      <th:block th:replace="~{modules/pagination :: pagination}"></th:block>
    </div>
  </div>
</th:block>
</html>
