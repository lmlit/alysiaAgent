services:
  alysia:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    container_name: alysia-server
    restart: always
    ports:
      - "6185:6185"
    env_file:
      - ../../.env
    environment:
      - TZ=Asia/Shanghai
      - ALYSIA_CONFIG=/app/config.yml
    volumes:
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6185/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
